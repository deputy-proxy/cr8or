name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP for frontend build dependencies
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install build-time PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore frontend build cache
        id: frontend-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: public/build
          key: ${{ runner.os }}-vite-build-${{ hashFiles('composer.lock', 'package-lock.json', 'vite.config.*', 'resources/**') }}

      - name: Build frontend
        run: npm run build

      - name: Cache frontend build for PHP tests
        if: steps.frontend-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: public/build
          key: ${{ runner.os }}-vite-build-${{ hashFiles('composer.lock', 'package-lock.json', 'vite.config.*', 'resources/**') }}

  php:
    needs: frontend-build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cr8or
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Application
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cr8or
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          composer install
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
          php -r "(file_exists('storage/oauth-private.key') && file_exists('storage/oauth-public.key')) ? print('Passport keys already exist.'.PHP_EOL) : passthru('php artisan passport:keys');"

      - name: Verify MySQL planning migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cr8or
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test tests/Feature/MySqlPlanningMigrationTest.php

      - name: Seed MySQL application descriptors
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cr8or
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan db:seed --class=AgentDescriptorSeeder --force
          php artisan db:seed --class=ExpertDescriptorSeeder --force

      - name: Verify MySQL planning migration rollback and re-application
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: cr8or
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          php artisan migrate:rollback --step=2 --force
          php artisan migrate --force
          php artisan migrate --force

      # Blade view tests need a Vite manifest. Prefer the build cache; fall back to a local build.
      - name: Restore frontend build cache
        id: frontend-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: public/build
          key: ${{ runner.os }}-vite-build-${{ hashFiles('composer.lock', 'package-lock.json', 'vite.config.*', 'resources/**') }}

      - name: Setup Node for fallback frontend build
        if: steps.frontend-build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies for fallback build
        if: steps.frontend-build-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build frontend for fallback manifest
        if: steps.frontend-build-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Run PHP CI Checks
        run: composer ci:check

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend helpers
        run: npm run test:js
